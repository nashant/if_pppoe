# os-if-pppoe: PPP link events from the if_pppoe kernel module.
# The kmod emits devctl "!system=PPPOE subsystem=<ifname> type=<TYPE> local=.. remote=.. dns1=.. dns2=.. mtu=..";
# devd turns each key=value into a variable and expands $var as $'value' (devd.conf(5)),
# and an absent key expands to an empty string (devd.cc config::get_variable).
# devd waits for each action, so "engine linkevent" only queues the event and starts a
# detached "engine drain" (daemon -f), which runs core's ppp-link{up,down}.sh in devd order.

notify 100 {
	match "system"		"PPPOE";
	match "subsystem"	"pppoe[0-9]+";
	match "type"		"(IPCP_UP|IPCP_DOWN|IPV6CP_UP|IPV6CP_DOWN|SESSION_UP|SESSION_DOWN|AUTH_FAIL)";
	action "/usr/local/opnsense/scripts/if_pppoe/engine linkevent $subsystem $type local=$local remote=$remote dns1=$dns1 dns2=$dns2 mtu=$mtu";
};
