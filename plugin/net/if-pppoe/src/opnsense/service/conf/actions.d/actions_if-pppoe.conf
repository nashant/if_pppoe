; topic word is "if-pppoe" (matches this filename's actions_<topic>.conf convention).
; parameters use a bare %s: configd's action runner already single-quotes and
; escapes each substituted parameter itself (opnsense/core
; src/opnsense/service/modules/actions/base.py:94-96), and
; Backend::configdpRun() escapeshellarg()s it again before it ever reaches
; configd (Backend.php:200-202). Quoting here too ('%s', as core never does --
; see actions_service.conf's own bare %s) would double-quote the value so it
; reaches the shell unescaped, cancelling that protection.

[status]
command:/usr/local/opnsense/scripts/if_pppoe/engine
parameters:status --json
type:script_output
message:if_pppoe combined status

[reconfigure]
command:/usr/local/opnsense/scripts/if_pppoe/set-desired.php
parameters:%s
type:script_output
message:persist if_pppoe desired state (%s)

[reconcile]
command:/usr/local/opnsense/scripts/if_pppoe/engine
parameters:reconcile
type:script
message:if_pppoe reconcile (cron backstop, every minute)

[reapply]
command:/bin/sh /usr/local/opnsense/scripts/if_pppoe/reapply.sh
parameters:cron
type:script
message:if_pppoe re-apply the interfaces.inc hook if core replaced it (cron backstop)

[notices]
command:/usr/local/opnsense/scripts/if_pppoe/engine
parameters:notices --json
type:script_output
message:if_pppoe boot result and notices
