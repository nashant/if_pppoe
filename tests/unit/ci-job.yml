# CI job snippet for the host unit tests + fuzzers (docs only).
#
# This is NOT wired into any workflow here. To add it, append the `unit-tests`
# job below to `.github/workflows/ci.yml` on branch `ci/pipeline` (do not edit
# that branch from here). The runner (ubuntu-24.04) already ships clang and
# gcc, so no container is needed there -- the `fuzz-docker` fallback in the
# Makefile is only for hosts without clang.
#
# `check` runs in well under a second; the short fuzz pass (30s/target) is a
# smoke test that the targets still build and the seed corpora and crash
# reproducers still behave. A longer nightly run belongs in nightly.yml with a
# larger FUZZ_SECONDS and the corpus cached between runs.

  unit-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install clang
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends clang
      - name: Unit tests (ASan + UBSan)
        run: make -C tests/unit check CC=clang
      - name: Regression corpora + known-crash reproducers
        run: make -C tests/unit fuzz-regress FUZZ_CC=clang
      - name: Short fuzz smoke (30s per target)
        run: make -C tests/unit fuzz FUZZ_CC=clang FUZZ_SECONDS=30
      - name: Upload fuzz crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: tests/unit/build/artifacts/
          if-no-files-found: ignore
