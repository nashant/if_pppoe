# accel-ppp config TEMPLATE for S02/T3 - live CHAP-MD5 authentication with
# secret redaction (M002/S02/T3).  Deployed to the S01-established harness
# host (<LAB_HOST>:~/if_pppoe-lab/isp-netns/) by run-chap.sh, which
# renders the @LABDIR@ placeholder the same way lab/isp-netns/up.sh does.
#
# Option citations: lab/isp-netns/README.md "accel-ppp.conf option
# reference" (accel-ppp.conf(5), fetched from the upstream URL) - every
# option here is verified against the man page and the shipped example
# config, none are guessed.
#
# Deltas vs the S01 server config (lab/isp-netns/accel-ppp.conf):
#  - [chap-secrets] `chap-secrets=` is @CREDS_FILE@, a per-run tmpfs
#    credential file holding only the T3 user run-chap.sh generates
#    (creds.sh); auth_chap_md5 validates against it.
#  - ipv4=allow + ipv6=deny: T3 proves LCP+CHAP auth hold.  IPCP address
#    negotiation is S03 scope, so the client legitimately answers IPCP
#    with TermAck; ipv4=require would make the server tear the session
#    down for the still-unnegotiated IPCP, which is not a CHAP failure.
#    The S01 ipv4=require floor is untouched for the M001 suite.
#  - [log] copy=1: duplicates the per-session log into the general log
#    so the server log itself records "authentication succeeded" for
#    the dedicated user (verify item 1); without it accel-ppp logs only
#    auth FAILURES at level 3.
#
# Nothing in this file contains a secret: the credential store is the
# separate per-run @CREDS_FILE@ (i.e. /etc/ppp/chap-secrets equivalent).

[modules]
log_file
pppoe
chap-secrets
# auth_pap is DELIBERATELY ABSENT: a mixed accept-pap+accept-chap server
# advertises PAP in ITS OWN LCP Configure-Request (first auth module) and
# Configure-Rejects a client that refuses PAP - the sppp client (T1
# wiring) is configured CHAP-only for T3, so the server must PROPOSE CHAP.
# accel-ppp advertises the auth protocol it will use in its ConfReq; with
# only auth_chap_md5 loaded the server proposes CHAP-MD5 and the RFC 1994
# challenge/response exchange follows.  (T2's PAP run used the reverse
# stance: the client accepted the server's PAP offer.)
auth_chap_md5
ippool
ipv6pool
ipv6_nd
ipv6_dhcp

[pppoe]
interface=eth0
service-name=lab
ac-name=isp-lab
# accept-blank-service: allowed because pppd-style clients send an empty
# Service-Name tag; see lab/isp-netns/README.md "Deviations from brief".
accept-blank-service=1
verbose=1

[ppp]
mtu=1492
mru=1492
min-mtu=1280
max-mtu=1500
ipv4=allow
ipv6=deny
lcp-echo-interval=10
lcp-echo-failure=6
verbose=1

[ip-pool]
gw-ip-address=10.99.0.1
10.99.0.100-199

[ipv6-pool]
# Lab-local ULA, not exercised by the CHAP test.
fc00:99:0:1::/64,64

[chap-secrets]
# S02/T3: file-based CHAP-MD5 backend (no RADIUS).  run-chap.sh renders
# @CREDS_FILE@ to a tmpfs path holding only the run's generated user.
chap-secrets=@CREDS_FILE@
gw-ip-address=10.99.0.1

[dns]
dns1=10.99.0.1

[cli]
telnet=127.0.0.1:2000
tcp=127.0.0.1:2001

[log]
log-file=/tmp/accel-ppp.log
level=3
# copy=1: duplicate the per-session log (auth success) into the general
# log - see header comment.
copy=1