# accel-ppp config TEMPLATE for S02/T2 — live PAP authentication with
# secret redaction (M002/S02/T2).  Deployed to the S01-established harness
# host (<LAB_HOST>:~/if_pppoe-lab/isp-netns/) by run-pap.sh, which
# renders the @LABDIR@ placeholder the same way lab/isp-netns/up.sh does.
#
# Option citations: lab/isp-netns/README.md "accel-ppp.conf option
# reference" (accel-ppp.conf(5), fetched from the upstream URL) — every
# option here is verified against the man page and the shipped example
# config, none are guessed.
#
# The single deliberate delta vs the S01 server config
# (lab/isp-netns/accel-ppp.conf): the [chap-secrets] module's
# `chap-secrets=` file is @CREDS_FILE@, a per-run tmpfs file (creds.sh)
# that auth_pap validates against.  CHAP-MD5 stays loaded (T3 needs it).
#
# Two further deltas vs the S01 conf, both T2-boundary-driven:
#  - ipv4=allow + ipv6=deny: T2/T3 prove LCP+auth hold.  IPCP address
#    negotiation is S03 scope (the sppp ip_addrs helpers are stand-ins
#    until S03), so the client legitimately answers IPCP with TermAck;
#    ipv4=require would make the server tear the session down for the
#    still-unnegotiated IPCP, which is not a PAP failure.  allow/deny
#    tolerates that so the connected state provably holds.  The S01
#    ipv4=require floor is untouched for the M001 suite.
#  - [log] copy=1: duplicates the per-session log into the general log
#    so the server log itself records "authentication succeeded" for
#    the dedicated user (verify item 1); without it accel-ppp logs only
#    auth FAILURES at level 3.
#
# Nothing in this file contains a secret: the credential store is the
# separate per-run @CREDS_FILE@ (i.e. /etc/ppp/pap-secrets equivalent).

[modules]
log_file
pppoe
chap-secrets
auth_pap
auth_chap_md5
ippool
ipv6pool
ipv6_nd
ipv6_dhcp

[pppoe]
interface=eth0
service-name=lab
ac-name=isp-lab
# accept-blank-service: allowed because pppd-style clients send an empty
# Service-Name tag; see lab/isp-netns/README.md "Deviations from brief".
accept-blank-service=1
verbose=1

[ppp]
mtu=1492
mru=1492
min-mtu=1280
max-mtu=1500
ipv4=allow
ipv6=deny
lcp-echo-interval=10
lcp-echo-failure=6
verbose=1

[ip-pool]
gw-ip-address=10.99.0.1
10.99.0.100-199

[ipv6-pool]
# Lab-local ULA, not exercised by the PAP test.
fc00:99:0:1::/64,64

[chap-secrets]
# S02/T2: file-based PAP backend (no RADIUS).  run-pap.sh renders
# @CREDS_FILE@ to a tmpfs path holding only the run's generated user.
chap-secrets=@CREDS_FILE@
gw-ip-address=10.99.0.1

[dns]
dns1=10.99.0.1

[cli]
telnet=127.0.0.1:2000
tcp=127.0.0.1:2001

[log]
log-file=/tmp/accel-ppp.log
level=3
# copy=1: duplicate the per-session log (auth success) into the general
# log — see header comment.
copy=1