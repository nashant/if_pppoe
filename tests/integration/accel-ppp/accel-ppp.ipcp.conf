# accel-ppp config TEMPLATE for M002/S03/T1 - live IPCP negotiation with
# in-kernel IPv4 address application (spike S2 recipe, R009).  Deployed to
# the S01-established harness host (<LAB_HOST>:~/if_pppoe-lab/isp-netns/)
# by run-ipcp.sh, which renders the @LABDIR@ placeholder the same way
# lab/isp-netns/up.sh does.
#
# Option citations: lab/isp-netns/README.md "accel-ppp.conf option
# reference" (accel-ppp.conf(5), fetched from the upstream URL) - every
# option here is verified against the man page and the shipped example
# config, none are guessed.
#
# Deltas vs the S02/T3 server config (tests/integration/accel-ppp/
# accel-ppp.chap.conf):
#  - ipv4=require (NOT the T2/T3 ipv4=allow): IPCP MUST actually negotiate
#    for this run - T1's whole point is the negotiated IPv4 address being
#    applied in-kernel via the sc_addr_task taskqueue under CURVNET_SET.
#    With ipv4=require the server tears the session down if IPCP fails to
#    open, so a successful hold proves IPCP truly opened (ipv4=allow would
#    tolerate a client answering IPCP with TermAck).
#  - auth is still CHAP-MD5 (auth_chap_md5 only, auth_pap absent): the
#    sppp client dial is configured myauth=chap with no advertisement
#    (accel-ppp's auth LCP option handler rejects any auth option the peer
#    advertises and proposes the first loaded auth module itself - memory
#    M002/auth-protocol-selection).  LCP + CHAP must complete before IPCP
#    can negotiate, so the recipe re-uses the proven run-chap.sh auth
#    shape; T1 asserts the client-side CHAP success in the module log too.
#  - chap-secrets= is @CREDS_FILE@, a per-run tmpfs credential file
#    holding only the user the run script generates (creds.sh).
#  - [ip-pool] gw-ip-address=10.99.0.1 + 10.99.0.100-199 and [dns]
#    dns1=10.99.0.1: carried over from the S01 config unchanged - the
#    client must show an inet from THIS pool with peer 10.99.0.1 on
#    ifconfig pppoe0 (verify item 4).
#  - [log] copy=1: duplicate the per-session log into the general log so
#    the server log records the session + IPCP up for the dedicated user.
#
# Nothing in this file contains a secret: the credential store is the
# separate per-run @CREDS_FILE@ (i.e. /etc/ppp/chap-secrets equivalent).

[modules]
log_file
pppoe
chap-secrets
auth_chap_md5
ippool
ipv6pool
ipv6_nd
ipv6_dhcp

[pppoe]
interface=eth0
service-name=lab
ac-name=isp-lab
# accept-blank-service: allowed because pppd-style clients send an empty
# Service-Name tag; see lab/isp-netns/README.md "Deviations from brief".
accept-blank-service=1
verbose=1

[ppp]
mtu=1492
mru=1492
min-mtu=1280
max-mtu=1500
# ipv4=require: IPCP must negotiate.  The server assigns the client an
# address from [ip-pool] and applies 10.99.0.1 as the peer/gateway; the
# sppp client's IPCP tlu then records req_myaddr/req_hisaddr and the
# driver's sc_addr_task applies them in-kernel (SIOCAIFADDR under
# CURVNET_SET on taskqueue_thread) - the exact path T1 proves live.
ipv4=require
ipv6=deny
lcp-echo-interval=10
lcp-echo-failure=6
verbose=1

[ip-pool]
gw-ip-address=10.99.0.1
10.99.0.100-199

[ipv6-pool]
# Lab-local ULA, not exercised by the T1 IPCP run.
fc00:99:0:1::/64,64

[chap-secrets]
# S03/T1: file-based CHAP-MD5 backend (no RADIUS).  The run script
# renders @CREDS_FILE@ to a tmpfs path holding only its generated user.
chap-secrets=@CREDS_FILE@
gw-ip-address=10.99.0.1

[dns]
dns1=10.99.0.1

[cli]
telnet=127.0.0.1:2000
tcp=127.0.0.1:2001

[log]
log-file=/tmp/accel-ppp.log
level=3
# copy=1: duplicate the per-session log (session up + IPCP negotiated)
# into the general log - see header comment.
copy=1