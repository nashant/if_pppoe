# pppd(8) client options for the S02/T2 live-PAP harness.
#
# This file documents and drives the *known-good-client* pre-check that
# run-pap.sh performs before the in-kernel dial: a stock pppd returns
# "PAP authentication succeeded" against the T2 accel-ppp config and
# proves the server side accepts the dedicated test user with the
# runtime-generated secret independently of the if_pppoe/sppp stack.
#
# run-pap.sh renders this template into a per-run temp file (0600) with
# the runtime-generated secret substituted in, runs pppd against it in a
# throwaway `cli` netns (same isolation smoke.sh uses), and deletes the
# temp file — the secret never lands in the repo, and never appears in
# any captured log, config dump, or process listing (pppd stores the
# secret in its options FILE, not in argv, so `ps` stays clean).

plugin pppoe.so
# device: replaced at run time with the client netns veth (cli-eth0)
@DEVICE@
user @T2USER@
password @TESTSECRET@
noauth
nodetach
debug
defaultroute