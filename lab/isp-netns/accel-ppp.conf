# accel-ppp config TEMPLATE for the PPPoE server in netns `isp` on the lab host.
# Option citations: see README.md "accel-ppp.conf option reference".
# up.sh renders this (sed s/@LABDIR@/.../; no line uses it any more, the
# hook is kept for local additions) to accel-ppp.rendered.conf next to it
# and starts accel-pppd with the rendered file -- see README.md
# "Deployment directory / config rendering".

[modules]
log_file
pppoe
chap-secrets
auth_pap
auth_chap_md5
ippool
ipv6pool
ipv6_nd
ipv6_dhcp

[pppoe]
interface=eth0
service-name=lab
ac-name=isp-lab
# accept-blank-service: see README.md "Deviations from brief" (item 4).
accept-blank-service=1
verbose=1

[ppp]
mtu=1492
mru=1492
min-mtu=1280
max-mtu=1500
ipv4=require
ipv6=allow
lcp-echo-interval=10
lcp-echo-failure=6
verbose=1

[ip-pool]
gw-ip-address=10.99.0.1
10.99.0.100-199

[ipv6-pool]
# Lab-local ULA, not specified in the brief; not exercised by smoke.sh.
fc00:99:0:1::/64,64

[chap-secrets]
# tmpfs (/run), never a file in this repo: each test run generates its own
# account and writes/removes it here (tests/functional/labcreds.py,
# lab/vm/lab-creds.sh).  The module reads this file on every
# authentication, so no reload is needed after an update -- see README.md
# "Lab accounts".
chap-secrets=/run/accel-ppp/chap-secrets
gw-ip-address=10.99.0.1

# [dns] was absent (IPCP req-pri-dns had nothing to hand out) -- added for
# tests/functional/test_ipcp.py; see that dir's README "known xfails".
[dns]
dns1=10.99.0.1

[cli]
telnet=127.0.0.1:2000
# tcp= added beyond the brief so accel-cmd (which speaks TCP, not telnet)
# can connect -- see README.md "Deviations from brief".
tcp=127.0.0.1:2001

[log]
log-file=/tmp/accel-ppp.log
level=3
